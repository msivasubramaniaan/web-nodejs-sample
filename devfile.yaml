schemaVersion: 2.3.0
metadata:
  name: composite-commands
components:
  - name: ubi9-tools
    container:
      image: registry.access.redhat.com/ubi9/nodejs-20:9.7
      args:
        - "tail"
        - "-f"
        - "/dev/null"
      endpoints:
        - exposure: public
          name: nodejs
          protocol: https
          targetPort: 3000
      memoryLimit: 2Gi
      memoryRequest: 256Mi
      mountSources: true
    attributes:
      controller.devfile.io/merge-contribution: true
  - name: ubi8-tools
    container:
      image: registry.access.redhat.com/ubi8-micro:latest
      args:
        - "tail"
        - "-f"
        - "/dev/null"
      memoryLimit: 2Gi
      memoryRequest: 256Mi
      mountSources: true

commands:
  - id: install-dependencies
    exec:
      label: "Install dependencies"
      component: ubi9-tools
      workingDir: ${PROJECT_SOURCE}/app
      commandLine: "npm install"
      group:
        kind: build
        isDefault: true

  - id: run-application
    exec:
      label: "Run web application"
      component: ubi9-tools
      workingDir: ${PROJECT_SOURCE}/app
      commandLine: "nodemon app.js"
      group:
        kind: run

  - id: run-application-node
    exec:
      label: "Run web application (node)"
      component: ubi9-tools
      workingDir: ${PROJECT_SOURCE}/app
      commandLine: "node app.js"
      group:
        kind: run

  - id: run-application-inspect
    exec:
      label: "Run web application (node inspect)"
      component: ubi9-tools
      workingDir: ${PROJECT_SOURCE}/app
      commandLine: "node --inspect app.js"
      group:
        kind: run

  - id: run-worker
    exec:
      label: "Run background worker"
      component: ubi9-tools
      workingDir: ${PROJECT_SOURCE}/app
      commandLine: "node worker.js"
      group:
        kind: run

  - id: run-application-watch
    exec:
      label: "Run web application (watch)"
      component: ubi9-tools
      workingDir: ${PROJECT_SOURCE}/app
      commandLine: "nodemon app.js"
      group:
        kind: run

  - id: debug
    exec:
      label: "Run web application (debugging enabled)"
      component: ubi9-tools
      workingDir: ${PROJECT_SOURCE}/app
      commandLine: "nodemon --inspect app.js"
      group:
        kind: debug
        isDefault: true

  - id: stop-application
    exec:
      label: "Stop web application"
      component: ubi9-tools
      commandLine: >-
        node_server_pids=$(pgrep -fx '.*nodemon (--inspect )?app.js' | tr "\\n" " ") &&
        echo "Stopping node server with PIDs: ${node_server_pids}" && 
        kill -15 ${node_server_pids} &>/dev/null && echo 'Done.'
      group:
        kind: run
  - id: print-env-variables
    exec:
      label: "Print Env Variables"
      component: ubi9-tools
      commandLine: "printenv"
  - id: node-version
    exec:
      label: "Check Node.js version"
      component: ubi9-tools
      commandLine: "node -v"
  - id: npm-version
    exec:
      label: "Check npm version"
      component: ubi9-tools
      commandLine: "npm -v"
  - id: ubi9-tools-version
    exec:
      label: "ubi9 container echo"
      component: ubi9-tools
      commandLine: "sh -c '. /etc/os-release; echo $PLATFORM_ID'"
  - id: ubi8-tools-version
    exec:
      label: "ubi8 container echo"
      component: ubi8-tools
      commandLine: "sh -c '. /etc/os-release; echo $PLATFORM_ID'"
  - id: sequential-ubi8-ubi9
    composite:
      label: "Sequential: Check echo ubi8-ubi9"
      commands:
        - ubi8-tools-version
        - ubi9-tools-version
      parallel: false
  - id: parallel-ubi8-ubi9
    composite:
      label: "Parallel: Check echo ubi8-ubi9"
      commands:
        - ubi8-tools-version
        - ubi9-tools-version
      parallel: true
  - id: npm-version-node-version
    composite:
      label: "Sequential: Check versions"
      commands:
        - npm-version
        - node-version
      parallel: false
  - id: check-versions-install-deps
    composite:
      label: "Check versions => Install deps"
      commands:
        - npm-version-node-version
        - install-dependencies
      parallel: false
  - id: parallel-check-versions
    composite:
      label: "Parallel: Check versions"
      commands:
        - npm-version
        - node-version
      parallel: true
  - id: install-deps-and-run-app
    composite:
      label: "Install deps => Run web app"
      commands:
        - install-dependencies
        - run-application
      parallel: false
  - id: parallel-install-deps-and-run-app
    composite:
      label: "Parallel: Install deps and Run web app"
      commands:
        - install-dependencies
        - run-application
      parallel: true
  - id: parallel-run-two-apps
    composite:
      label: "Parallel: Run app and worker"
      commands:
        - run-application-watch
        - run-worker
      parallel: true
  - id: sequential-run-two-apps
    composite:
      label: "Sequential: Run app and worker"
      commands:
        - run-worker
        - run-application-watch
      parallel: false
  - id: check-node-and-install-deps-and-run-app
    composite:
      label: "Check Node.js version => Install deps => Run web app"
      commands:
        - node-version
        - install-dependencies
        - run-application
      parallel: false
  - id: check-versions-install-deps-run-app
    composite:
      label: "Check versions => Install deps => Run web app"
      commands:
        - check-versions-install-deps
        - run-application
      parallel: false
  - id: print-env-variables-check-versions
    composite:
      label: "Print Env variables => Check versions"
      commands:
        - print-env-variables
        - npm-version-node-version
      parallel: false
  - id: parallel-print-env-variables-check-versions
    composite:
      label: "Parallel: Print Env variables => Check versions"
      commands:
        - print-env-variables
        - npm-version-node-version
      parallel: true
