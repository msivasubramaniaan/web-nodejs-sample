schemaVersion: 2.3.0
metadata:
  name: composite-commands
components:
  - name: ubi9-tools
    container:
      image: registry.access.redhat.com/ubi9/nodejs-20:9.7
      args:
        - "tail"
        - "-f"
        - "/dev/null"
      env:
        - name: BUILD_ROOT
          value: ${PROJECT_SOURCE}/app
      endpoints:
        - exposure: public
          name: nodejs
          protocol: https
          targetPort: 3000
      memoryLimit: 2Gi
      memoryRequest: 256Mi
      mountSources: true
    attributes:
      controller.devfile.io/merge-contribution: true
  - name: ubi8-tools
    container:
      image: registry.access.redhat.com/ubi8-micro:latest
      args:
        - "tail"
        - "-f"
        - "/dev/null"
      memoryLimit: 2Gi
      memoryRequest: 256Mi
      mountSources: true
  - name: node-runtime
    container:
      image: node:20
      args:
        - tail
        - -f
        - /dev/null
      mountSources: true
  - name: alpine
    container:
      image: alpine:3.20
      args:
        - tail
        - -f
        - /dev/null
      memoryLimit: 2Gi
      memoryRequest: 256Mi
      mountSources: true
      env:
        - name: BUILD_ROOT
          value: ${PROJECT_SOURCE}/app

commands:
  - id: install-dependencies
    exec:
      label: "Install dependencies"
      component: ubi9-tools
      workingDir: ${PROJECT_SOURCE}/app
      commandLine: "npm install"
      group:
        kind: build
        isDefault: true

  - id: run-application
    exec:
      label: "Run web application"
      component: ubi9-tools
      workingDir: ${PROJECT_SOURCE}/app
      commandLine: "nodemon app.js"
      group:
        kind: run

  - id: run-application-node
    exec:
      label: "Run web application (node)"
      component: ubi9-tools
      workingDir: ${PROJECT_SOURCE}/app
      commandLine: "node app.js"
      group:
        kind: run

  - id: run-application-inspect
    exec:
      label: "Run web application (node inspect)"
      component: ubi9-tools
      workingDir: ${PROJECT_SOURCE}/app
      commandLine: "node --inspect app.js"
      group:
        kind: run

  - id: run-worker
    exec:
      label: "Run background worker"
      component: node-runtime
      workingDir: ${PROJECT_SOURCE}/app
      commandLine: "node worker.js"
      group:
        kind: run

  - id: run-application-watch
    exec:
      label: "Run web application (watch)"
      component: ubi9-tools
      workingDir: ${PROJECT_SOURCE}/app
      commandLine: "nodemon app.js"
      group:
        kind: run

  - id: debug
    exec:
      label: "Run web application (debugging enabled)"
      component: ubi9-tools
      workingDir: ${PROJECT_SOURCE}/app
      commandLine: "nodemon --inspect app.js"
      group:
        kind: debug
        isDefault: true

  - id: stop-application
    exec:
      label: "Stop web application"
      component: ubi9-tools
      commandLine: >-
        node_server_pids=$(pgrep -fx '.*nodemon (--inspect )?app.js' | tr "\\n" " ") &&
        echo "Stopping node server with PIDs: ${node_server_pids}" && 
        kill -15 ${node_server_pids} &>/dev/null && echo 'Done.'
      group:
        kind: run
  - id: print-env-variables
    exec:
      label: "Print Env Variables"
      component: ubi9-tools
      commandLine: "printenv"
  - id: node-version
    exec:
      label: "Check Node.js version"
      component: ubi9-tools
      commandLine: "node -v"
  - id: npm-version
    exec:
      label: "Check npm version"
      component: ubi9-tools
      commandLine: "npm -v"
  - id: ubi9-tools-version
    exec:
      label: "ubi9 container echo"
      component: ubi9-tools
      commandLine: "sh -c '. /etc/os-release; echo $PLATFORM_ID'"
  - id: ubi8-tools-version
    exec:
      label: "ubi8 container echo"
      component: ubi8-tools
      commandLine: "sh -c '. /etc/os-release; echo $PLATFORM_ID'"
  - id: sequential-ubi8-ubi9
    composite:
      label: "Sequential: Check echo ubi8-ubi9"
      commands:
        - ubi8-tools-version
        - ubi9-tools-version
      parallel: false
  - id: parallel-ubi8-ubi9
    composite:
      label: "Parallel: Check echo ubi8-ubi9"
      commands:
        - ubi8-tools-version
        - ubi9-tools-version
      parallel: true
  - id: npm-version-node-version
    composite:
      label: "Sequential: Check versions"
      commands:
        - npm-version
        - node-version
      parallel: false
  - id: check-versions-install-deps
    composite:
      label: "Check versions => Install deps"
      commands:
        - npm-version-node-version
        - install-dependencies
      parallel: false
  - id: parallel-check-versions
    composite:
      label: "Parallel: Check versions"
      commands:
        - npm-version
        - node-version
      parallel: true
  - id: install-deps-and-run-app
    composite:
      label: "Install deps => Run web app"
      commands:
        - install-dependencies
        - run-application
      parallel: false
  - id: parallel-install-deps-and-run-app
    composite:
      label: "Parallel: Install deps and Run web app"
      commands:
        - install-dependencies
        - run-application
      parallel: true
  - id: parallel-run-two-apps
    composite:
      label: "Parallel: Run app and worker"
      commands:
        - run-application-watch
        - run-worker
      parallel: true
  - id: sequential-run-two-apps
    composite:
      label: "Sequential: Run app and worker"
      commands:
        - run-worker
        - run-application-watch
      parallel: false
  - id: check-node-and-install-deps-and-run-app
    composite:
      label: "Check Node.js version => Install deps => Run web app"
      commands:
        - node-version
        - install-dependencies
        - run-application
      parallel: false
  - id: check-versions-install-deps-run-app
    composite:
      label: "Check versions => Install deps => Run web app"
      commands:
        - check-versions-install-deps
        - run-application
      parallel: false
  - id: print-env-variables-check-versions
    composite:
      label: "Print Env variables => Check versions"
      commands:
        - print-env-variables
        - npm-version-node-version
      parallel: false
  - id: parallel-print-env-variables-check-versions
    composite:
      label: "Parallel: Print Env variables => Check versions"
      commands:
        - print-env-variables
        - npm-version-node-version
      parallel: true
  - id: fail-command
    exec:
      label: "Intentional Failure"
      component: ubi9-tools
      workingDir: ${PROJECT_SOURCE}/app
      commandLine: "eeeeecho FAIL"
  - id: sequential-failure-test
    composite:
      label: "Sequential: Stop On Failure"
      commands:
        - node-version
        - fail-command
        - npm-version
      parallel: false
  - id: bg-command
    exec:
      label: "Background Command"
      component: ubi9-tools
      commandLine: "sh -c 'echo Start Background Task; sleep 5; echo Complete Background Task' &"
  - id: after-bg-command
    exec:
      label: "NEXT Task after BG Command"
      component: ubi9-tools
      commandLine: "sh -c 'sleep 1; echo NEXT Task after BG TASK'"
  - id: bg-in-composite
    composite:
      label: "Background operator stripped"
      commands:
        - bg-command
        - after-bg-command
      parallel: false
  - id: workdir-root
    exec:
      label: "Check workingDir - root"
      component: ubi9-tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: >
        sh -c 'printf "Actual: %s\nExpected: %s\n" "$PWD" "/projects/web-nodejs-sample"'

  - id: workdir-app
    exec:
      label: "Check workingDir - app"
      component: ubi9-tools
      workingDir: ${PROJECT_SOURCE}/app
      commandLine: >
        sh -c 'printf "Actual: %s\nExpected: %s\n" "$PWD" "/projects/web-nodejs-sample/app"'

  - id: workdir-in-composite
    composite:
      label: "Composite: Check workingDir"
      commands:
        - workdir-root
        - workdir-app
      parallel: false

  - id: env-test
    exec:
      label: "Check Env Variables"
      component: ubi8-tools
      workingDir: ${PROJECT_SOURCE}/app
      env:
        - name: GOPATH
          value: ${PROJECT_SOURCE}/.go
        - name: GOCACHE
          value: ${PROJECT_SOURCE}/.cache
      commandLine: "sh -c 'echo ${GOPATH} && echo ${GOCACHE}'"

  - id: env-test-2
    exec:
      component: ubi8-tools
      workingDir: ${PROJECT_SOURCE}/app
      env:
        - name: SERVICE
          value: backend
      commandLine: "sh -c 'echo ${SERVICE}'"

  - id: env-test-3
    exec:
      component: ubi8-tools
      workingDir: ${PROJECT_SOURCE}/app
      env:
        - name: MODE
          value: test
      commandLine: "sh -c 'echo ${MODE}'"

  - id: env-composite-seq
    composite:
      label: "Env Composite Sequential"
      commands:
        - env-test
        - env-test-2
        - env-test-3

  - id: env-composite-parallel
    composite:
      label: "Env Composite Parallel"
      parallel: true
      commands:
        - env-test
        - env-test-2
        - env-test-3
   
  - id: resolve-container-env-var
    exec:
      label: "Resolve Container Env Var for workingDir"
      component: ubi9-tools
      workingDir: ${BUILD_ROOT}
      commandLine: "pwd"

  - id: resolve-container-env-var-root
    exec:
      label: "Resolve PROJECT_SOURCE for workingDir"
      component: ubi9-tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "pwd"

  - id: sequential-workdir-ubi9
    composite:
      label: "Sequential: Container Env Var for workingDir"
      commands:
        - resolve-container-env-var
        - resolve-container-env-var-root
      parallel: false

  - id: parallel-workdir-ubi9
    composite:
      label: "Parallel: Container Env Var for workingDir"
      commands:
        - resolve-container-env-var
        - resolve-container-env-var-root
      parallel: true

  - id: show-alpine-build-root
    exec:
      component: alpine
      workingDir: ${BUILD_ROOT}
      commandLine: |
        sh -c 'echo BUILD_ROOT=${BUILD_ROOT}; pwd'

  - id: show-alpine-home
    exec:
      component: alpine
      commandLine: |
        sh -c '
          echo HOME_BRACED=${HOME};
          echo HOME_SHELL=$HOME
        '
  - id: composite-alpine-sequential
    composite:
      parallel: false
      commands:
      - show-alpine-build-root
      - show-alpine-home

  - id: composite-alpine-parallel
    composite:
      parallel: true
      commands:
      - show-alpine-build-root
      - show-alpine-home
  
  - exec:
      label: "Build Go Application"
      component: runtime
      env:
        - name: GOPATH
          value: /projects/devfile-stack-go/.go
        - name: GOCACHE
          value: /projects/devfile-stack-go/.cache
      commandLine: echo "GOCACHE=$GOCACHE" && go build main.go
      group:
        kind: build
        isDefault: true
      workingDir: /projects/devfile-stack-go
    id: build-go-app

  - exec:
      label: "Test Go Application"
      component: runtime
      env:
        - name: TEST
          value: "the quote\""
      commandLine: echo "TEST=$TEST" && echo "------------------" && export
      group:
        kind: run
        isDefault: false
      workingDir: /projects/devfile-stack-go
    id: test-go-app

  - id: build-and-test-go-app
    composite:
      label: "Build and Test Go Application"
      commands:
        - build-go-app
        - test-go-app
      parallel: false
